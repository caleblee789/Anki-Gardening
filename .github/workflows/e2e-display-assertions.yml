name: E2E Display Assertions

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  display-assertions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pillow

      - name: Run full test suite
        run: pytest -q

      - name: Audit local artwork
        run: python scripts/audit_assets.py

      - name: Compile runtime and tests
        run: PYTHONPYCACHEPREFIX=/tmp/anki-garden-pycache python -m compileall -q ankigarden scripts tests

      - name: Check patch whitespace
        run: git show --check --oneline --format= HEAD

      - name: Build and verify package
        run: |
          python scripts/package_addon.py --production
          python -m zipfile -t dist/anki_garden.ankiaddon

      - name: Verify source/archive parity
        run: |
          python - <<'PY'
          import hashlib
          import zipfile
          from scripts.package_addon import (
              ADDON,
              OUTPUT,
              PRODUCTION_BUILD,
              package_files,
              package_payload,
          )

          with zipfile.ZipFile(OUTPUT) as archive:
              names = set(archive.namelist())
              expected = {
                  path.relative_to(ADDON).as_posix(): package_payload(
                      path,
                      PRODUCTION_BUILD,
                  )
                  for path in package_files(PRODUCTION_BUILD)
              }
              assert names == set(expected), (sorted(set(expected) - names), sorted(names - set(expected)))
              for name, payload in expected.items():
                  assert hashlib.sha256(payload).digest() == hashlib.sha256(archive.read(name)).digest(), name
          PY
