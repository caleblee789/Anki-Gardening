name: Release Evidence

on:
  pull_request:
    paths:
      - 'ankigarden/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/release-evidence.yml'
      - 'pytest.ini'
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

jobs:
  release-evidence:
    name: release-evidence (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: package
            test_paths: >-
              tests/test_package.py
              tests/test_capture_contract_v25.py
          - shard: artwork
            test_paths: tests/test_twilight_v6_library_qa.py
          - shard: dialogs
            qt_args: --require-qt
            test_paths: >-
              tests/test_dialog_content_fit_live.py
              tests/test_full_catalog_layout_matrix.py
              tests/test_live_ui_layout.py
              tests/test_sync_reward_summary.py
          - shard: layout
            qt_args: --require-qt
            test_paths: >-
              tests/test_garden_studio_advanced_scroll_regression.py
              tests/test_release_restart_and_render_matrix.py
          - shard: tooling
            test_paths: >-
              tests/test_refinement_handoff.py
              tests/test_balance_report_builder.py

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pillow reportlab pypdf

      - name: Install Anki Qt for required native widget checks
        if: matrix.qt_args == '--require-qt'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
          python -m pip install 'aqt[qt]==26.8.1'

      - name: Run release-evidence tests
        run: >-
          timeout --foreground --signal=TERM 60s
          pytest -q -o addopts='' -m release_evidence
          ${{ matrix.qt_args }}
          --junitxml=build/release-evidence/${{ matrix.shard }}.xml
          ${{ matrix.test_paths }}

      - name: Retain test results and runtime identity
        if: always()
        run: |
          mkdir -p build/release-evidence
          git rev-parse HEAD > build/release-evidence/source-commit.txt
          python -m pip freeze > build/release-evidence/dependencies.txt

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}-${{ matrix.shard }}
          path: build/release-evidence/
          if-no-files-found: error
